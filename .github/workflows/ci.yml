name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'codex/**'

permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Audit source and full Git history
        run: npm run privacy:check

      - name: Install dependencies
        run: 'npm ci --ignore-scripts --loglevel=error'

      - name: Test
        run: npm test

      - name: Run lint
        run: 'npm run lint'
      - name: Typecheck
        run: npm run typecheck
      - name: Run n8n source and tarball vetting
        run: npm run vetting:check
